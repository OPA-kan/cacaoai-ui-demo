<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}</style>
</head>
<body>
  <iframe id="app" src="index.html"></iframe>
  <script>
    const frame = document.getElementById('app');

      frame.contentWindow.showScreen('outcome');
    });
  </script>
</body>
</html>
